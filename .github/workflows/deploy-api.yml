name: Deploy Saee Academy API to Cloudflare

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "public/**"
      - "migrations/**"
      - "wrangler.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:
    inputs:
      apply_d1_migrations:
        description: "Apply pending D1 migrations (requires D1 Edit permission on the Cloudflare API token)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: saee-academy-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --frozen --all-groups

      # D1 migrations are opt-in so a token that can deploy Workers but does
      # not have D1 Edit permission will not block ordinary application deploys.
      - name: Apply D1 migrations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_d1_migrations == true }}
        run: npx --yes wrangler d1 migrations apply saee-academy-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bbfb58a712000ff24625a5960c5615ed

      - name: Deploy Worker
        run: uv run pywrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bbfb58a712000ff24625a5960c5615ed
