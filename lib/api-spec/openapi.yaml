openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: API for the Sai Academic learning platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: courses
    description: Authenticated course discovery and lessons
  - name: students
    description: Student profiles and subscription requests
  - name: admin
    description: Administrator course and request management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getCurrentUser
      tags: [students]
      summary: Get the signed-in user profile
      responses:
        "200":
          description: Current user and role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Authentication required
  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: Search available courses
      parameters:
        - in: query
          name: search
          schema:
            type: string
            maxLength: 120
        - in: query
          name: major
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: Matching courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
        "401":
          description: Authentication required
  /majors:
    get:
      operationId: listMajors
      tags: [courses]
      summary: List majors that have courses
      responses:
        "200":
          description: Majors
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /courses/{courseId}:
    get:
      operationId: getCourse
      tags: [courses]
      summary: Get course details
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Course details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "404":
          description: Course not found
  /courses/{courseId}/lessons:
    get:
      operationId: getCourseLessons
      tags: [courses]
      summary: Get lessons for an active subscriber
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Course lessons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseLesson"
        "403":
          description: Active subscription required
        "404":
          description: Course not found
  /courses/{courseId}/requests:
    post:
      operationId: requestCourseSubscription
      tags: [students]
      summary: Request a subscription to a course
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "201":
          description: Subscription request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionRequest"
        "404":
          description: Course not found
        "409":
          description: A request or active subscription already exists
  /me/requests:
    get:
      operationId: listMyRequests
      tags: [students]
      summary: List the signed-in student's requests
      responses:
        "200":
          description: Student requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionRequest"
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Get administrator dashboard totals
      responses:
        "200":
          description: Dashboard totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
        "403":
          description: Administrator access required
  /admin/requests:
    get:
      operationId: listAdminRequests
      tags: [admin]
      summary: List subscription requests for review
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/RequestStatus"
      responses:
        "200":
          description: Requests for administrator review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionRequest"
        "403":
          description: Administrator access required
  /admin/requests/{requestId}:
    patch:
      operationId: reviewSubscriptionRequest
      tags: [admin]
      summary: Approve or reject a subscription request
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestReviewInput"
      responses:
        "200":
          description: Reviewed subscription request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionRequest"
        "400":
          description: Invalid review decision
        "403":
          description: Administrator access required
        "404":
          description: Request not found
  /admin/courses:
    post:
      operationId: createCourse
      tags: [admin]
      summary: Create a course with up to 30 lesson links
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "201":
          description: Created course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          description: Invalid course data
        "403":
          description: Administrator access required
  /admin/courses/{courseId}:
    put:
      operationId: updateCourse
      tags: [admin]
      summary: Update course information and lessons
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "200":
          description: Updated course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          description: Invalid course data
        "403":
          description: Administrator access required
        "404":
          description: Course not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UserProfile:
      type: object
      properties:
        userId:
          type: string
        name:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        isAdmin:
          type: boolean
      required: [userId, name, email, isAdmin]
    Course:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        major:
          type: string
        instructor:
          type: string
        description:
          type: ["string", "null"]
        priceJod:
          type: number
        lessonCount:
          type: integer
        updatedAt:
          type: string
          format: date-time
      required: [id, title, major, instructor, description, priceJod, lessonCount, updatedAt]
    CourseLesson:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        videoUrl:
          type: string
          format: uri
        position:
          type: integer
      required: [id, title, videoUrl, position]
    LessonInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        videoUrl:
          type: string
          format: uri
      required: [title, videoUrl]
    CourseInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        major:
          type: string
          minLength: 1
          maxLength: 120
        instructor:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: ["string", "null"]
          maxLength: 1500
        priceJod:
          type: number
          minimum: 0
          maximum: 10000
        lessons:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/LessonInput"
      required: [title, major, instructor, description, priceJod, lessons]
    RequestStatus:
      type: string
      enum: [pending, approved, rejected]
    RequestReviewInput:
      type: object
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        durationDays:
          type: ["integer", "null"]
          minimum: 1
          maximum: 3650
      required: [decision]
    SubscriptionRequest:
      type: object
      properties:
        id:
          type: integer
        courseId:
          type: integer
        courseTitle:
          type: string
        major:
          type: string
        instructor:
          type: string
        priceJod:
          type: number
        studentName:
          type: string
        studentEmail:
          type: string
          format: email
        status:
          $ref: "#/components/schemas/RequestStatus"
        durationDays:
          type: ["integer", "null"]
        expiresAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, courseId, courseTitle, major, instructor, priceJod, studentName, studentEmail, status, durationDays, expiresAt, createdAt]
    AdminSummary:
      type: object
      properties:
        totalCourses:
          type: integer
        pendingRequests:
          type: integer
        activeSubscriptions:
          type: integer
        totalStudents:
          type: integer
        totalLessons:
          type: integer
      required: [totalCourses, pendingRequests, activeSubscriptions, totalStudents, totalLessons]

