name: Deploy Saee Academy API to Cloudflare

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "migrations/**"
      - "wrangler.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install project dependencies
        run: uv sync --frozen --all-groups
      - name: Deploy Worker
        run: uv run pywrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
